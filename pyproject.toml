[project]
name = "enterprise-asset-os"
version = "0.1.0"
description = "Production-grade Enterprise Asset & Telemetry MCP Server built with FastMCP 4 (2026-07-28 stateless baseline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.4",
]

[project.scripts]
enterprise-asset-os = "enterprise_asset_os:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

