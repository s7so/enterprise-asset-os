name: mcp-server-ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Stdout purity check
        run: |
          if grep -rn "print(" server.py; then
            echo "::error::print() detected — stdout must stay JSON-RPC only"
            exit 1
          fi
